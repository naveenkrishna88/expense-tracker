<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Main Wallet/Card Graphic -->
  <g filter="url(#shadow)">
    <!-- Credit Card Shape Backing -->
    <rect x="38" y="52" width="116" height="74" rx="14" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
    <!-- Upper Magnetic Strip / Accent -->
    <rect x="38" y="68" width="116" height="14" fill="#047857"/>
    <!-- Front Wallet Flap / Chip -->
    <rect x="52" y="92" width="22" height="18" rx="4" fill="#fbbf24"/>
    <!-- Indian Rupee / Currency Symbol Emblem -->
    <circle cx="120" cy="100" r="16" fill="url(#cardGrad)"/>
    <path d="M115 93 h10 M115 97 h10 M115 93 v14 M120 97 a 4 4 0 0 0 0 -4 M118 102 l5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Growth Spark / Arrow -->
  <path d="M50 148 L80 134 L105 142 L142 122" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 122 H142 V132" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
