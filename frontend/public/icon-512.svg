<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 8"/>

  <!-- Main Wallet/Card Graphic -->
  <g filter="url(#shadow512)">
    <!-- Credit Card Shape Backing -->
    <rect x="100" y="140" width="312" height="200" rx="36" fill="#022c22" stroke="#10b981" stroke-width="6"/>
    <!-- Upper Magnetic Strip / Accent -->
    <rect x="100" y="184" width="312" height="38" fill="#047857"/>
    <!-- Front Chip -->
    <rect x="140" y="248" width="60" height="48" rx="10" fill="#fbbf24"/>
    <line x1="140" y1="272" x2="200" y2="272" stroke="#d97706" stroke-width="2"/>
    <line x1="170" y1="248" x2="170" y2="296" stroke="#d97706" stroke-width="2"/>

    <!-- Currency Emblem -->
    <circle cx="320" cy="272" r="44" fill="url(#cardGrad512)"/>
    <path d="M308 252 h24 M308 262 h24 M308 252 v38 M320 262 a 10 10 0 0 0 0 -10 M315 278 l14 14" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Growth Spark / Arrow -->
  <path d="M130 395 L210 360 L280 380 L382 325" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356 325 H382 V351" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
